name: Generate Galaga Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: Mancinix
          games: 'galaga'   
